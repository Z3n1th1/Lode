# Conversation modes. A mode bundles: which skill pack primes the turn, which
# model tier to prefer, how much autonomy the agent has, and which tools are
# offered. Preset via the UI selector, a new-session default, or natural
# language ("进入挖洞模式").
#
# One action mode on purpose. Black-box SRC and authorized pentest are the same
# posture on the same kind of target — recon, validate, chain, report against a
# scope you were given — so they share one pack and one toolset instead of two
# near-identical modes. CTF solving and white-box code audit are not that: they
# act on a challenge artifact / a source tree rather than a live authorized
# asset, and they have been moved out of the product (code + skill packs now live
# outside this repo, in E:\LLM\Lode-parked\).
modes:
  chat:
    title: 对话
    skill: chat
    tier: explorer
    autonomy: none
    tools: []
    system_fragment: "纯对话模式：只讨论与推理，不主动发起任何扫描或请求。"
  pentest:
    title: 挖洞
    skill: pentest
    tier: reasoner
    autonomy: ask
    tools: [scan_target, run_agent_analysis, fetch_url, show_blackboard, add_candidates, show_progress, auto_scan, read_knowledge]
    system_fragment: "挖洞模式：黑盒 SRC 与授权渗透同一套打法，只在授权范围内动手。存在性探针（注入/越权/XSS/RCE 形状的 id/whoami/echo/time）要发；查询与新增测试数据可做；删除/拖库/改已有数据、反弹、webshell 由闸门硬拒。本机命令走命令研判正则门。"
