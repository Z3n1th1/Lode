<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SurfaceForge · SRC Agent</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --border: #30363d;
    --text: #e6edf3; --text-dim: #8b949e; --accent: #178e8b; --accent-hi: #1ba19e;
    --user: #1f6feb; --assistant: #178e8b; --tool: #d29922; --error: #f85149; --ok: #3fb950;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  a { color: var(--accent-hi); }
  .layout { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  /* Sidebar */
  .sidebar { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-head { padding: 16px; border-bottom: 1px solid var(--border); }
  .sidebar-head h1 { margin: 0 0 4px; font-size: 16px; letter-spacing: .3px; }
  .sidebar-head p { margin: 0; font-size: 12px; color: var(--text-dim); }
  .sidebar-actions { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
  .session-list { flex: 1; overflow-y: auto; padding: 8px; }
  .session-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; }
  .session-item:hover { background: var(--panel2); }
  .session-item.active { background: rgba(23,142,139,.15); border-color: var(--accent); }
  .session-item .sid { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .session-item .preview { font-size: 12px; margin: 3px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .meta { font-size: 11px; color: var(--text-dim); display: flex; gap: 8px; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px; background: var(--panel2); border: 1px solid var(--border); }
  .badge.ok { color: var(--ok); border-color: rgba(63,185,80,.4); }
  .badge.warn { color: var(--tool); border-color: rgba(210,153,34,.4); }
  /* Main */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .topbar { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; background: var(--panel); }
  .topbar .title { font-weight: 600; }
  .topbar .stats { display: flex; gap: 14px; margin-left: auto; font-size: 12px; color: var(--text-dim); }
  .stat b { color: var(--text); }
  .messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 900px; margin: 0 auto 18px; }
  .msg-head { font-size: 11px; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
  .msg.user .bubble { background: rgba(31,111,235,.12); border-left: 3px solid var(--user); }
  .msg.assistant .bubble { background: var(--panel); border-left: 3px solid var(--assistant); }
  .msg.event .bubble { background: var(--panel2); border-left: 3px solid var(--tool); font-family: var(--mono); font-size: 12px; }
  .bubble { padding: 12px 16px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  .bubble code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 12px; }
  .bubble pre { background: var(--panel2); padding: 10px; border-radius: 6px; overflow-x: auto; font-family: var(--mono); font-size: 12px; }
  .composer { border-top: 1px solid var(--border); padding: 14px 20px; background: var(--panel); }
  .composer-inner { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font: inherit; resize: none; min-height: 46px; max-height: 200px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 500; cursor: pointer; }
  button:hover { background: var(--accent-hi); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; font-size: 12px; }
  button.ghost:hover { background: var(--panel2); }
  .empty { text-align: center; color: var(--text-dim); padding: 60px 20px; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; text-align: center; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <h1>SurfaceForge</h1>
      <p>SRC 漏洞挖掘 Agent</p>
    </div>
    <div class="sidebar-actions">
      <button class="ghost" id="newBtn">＋ 新会话</button>
      <button class="ghost" id="refreshBtn">刷新</button>
    </div>
    <div class="session-list" id="sessionList">
      <div class="empty" style="padding:30px 10px;font-size:12px">加载中…</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="title" id="sessionTitle">新会话</span>
      <span class="badge" id="sessionBadge" style="display:none"></span>
      <div class="stats" id="stats"></div>
    </div>
    <div class="messages" id="messages">
      <div class="empty">
        <p>跟 Agent 对话开始测试</p>
        <p style="font-size:12px;max-width:520px;margin:16px auto 0">
          试试：<br>
          <code>帮我测 www.example.com，H1 项目，scope 是 example.com</code><br>
          <code>全自动跑一遍 target.com</code><br>
          <code>继续深挖刚才发现的 500 端点</code>
        </p>
      </div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" placeholder="输入指令… (Enter 发送，Shift+Enter 换行)" rows="1"></textarea>
        <button id="sendBtn">发送</button>
      </div>
      <div class="hint" id="hint">Agent 只会发 scope 内的 GET/HEAD，不会修改目标数据</div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const API = '';
let currentSession = '';
let busy = false;

async function api(path, opts = {}) {
  const res = await fetch(API + path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 401) { location.reload(); throw new Error('unauthorized'); }
  if (!res.ok) {
    let d = ''; try { d = (await res.json()).detail || ''; } catch {}
    throw new Error(`HTTP ${res.status} ${d}`);
  }
  if (res.status === 204) return null;
  return res.json();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
  let h = esc(text);
  // code blocks
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => `<pre>${code.trim()}</pre>`);
  // inline code
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // bold
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return h;
}

function addMessage(role, content, ts) {
  const box = document.getElementById('messages');
  if (box.querySelector('.empty')) box.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const label = role === 'user' ? '你' : role === 'assistant' ? 'Agent' : '事件';
  el.innerHTML = `<div class="msg-head">${label}</div><div class="bubble">${renderMarkdown(content)}</div>`;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

function setBusy(b) {
  busy = b;
  document.getElementById('sendBtn').disabled = b;
  document.getElementById('sendBtn').innerHTML = b ? '<span class="spinner"></span> 运行中' : '发送';
}

async function loadSessions() {
  try {
    const data = await api('/api/v1/src-agent/sessions');
    const list = document.getElementById('sessionList');
    const sessions = data.sessions || [];
    if (!sessions.length) {
      list.innerHTML = '<div class="empty" style="padding:30px 10px;font-size:12px">还没有会话<br>点击「新会话」开始</div>';
      return;
    }
    list.innerHTML = sessions.map(s => {
      const done = (s.intents_queued||0) + (s.intents_done||0);
      const preview = s.last_user || s.session_id;
      const target = (s.targets && s.targets[0]) ? s.targets[0].replace(/^https?:\/\//,'').slice(0,32) : '';
      return `<div class="session-item ${s.session_id===currentSession?'active':''}" data-sid="${esc(s.session_id)}">
        <div class="sid">${esc(s.session_id)}</div>
        <div class="preview">${esc(preview)}</div>
        <div class="meta">
          <span class="badge">${s.turns||0} 轮</span>
          ${target?`<span>${esc(target)}</span>`:''}
          ${s.hints?`<span class="badge ok">${s.hints} 发现</span>`:''}
          ${s.intents_queued?`<span class="badge warn">${s.intents_queued} 待挖</span>`:''}
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('.session-item').forEach(el => {
      el.onclick = () => openSession(el.dataset.sid);
    });
    // Update stats
    const totalHints = sessions.reduce((a,s) => a + (s.hints||0), 0);
    const totalQueued = sessions.reduce((a,s) => a + (s.intents_queued||0), 0);
    const totalDone = sessions.reduce((a,s) => a + (s.intents_done||0), 0);
    document.getElementById('stats').innerHTML =
      `<span class="stat">会话 <b>${sessions.length}</b></span>
       <span class="stat">发现 <b>${totalHints}</b></span>
       <span class="stat">待挖 <b>${totalQueued}</b></span>
       <span class="stat">已完成 <b>${totalDone}</b></span>`;
  } catch (e) {
    document.getElementById('sessionList').innerHTML =
      `<div class="empty" style="padding:30px 10px;font-size:12px;color:var(--error)">加载失败: ${esc(e.message)}</div>`;
  }
}

async function openSession(sid) {
  currentSession = sid;
  document.getElementById('sessionTitle').textContent = sid;
  document.getElementById('sessionBadge').style.display = 'inline-block';
  document.getElementById('sessionBadge').textContent = '已加载';
  const box = document.getElementById('messages');
  box.innerHTML = '<div class="empty">加载历史…</div>';
  try {
    const data = await api('/api/v1/src-agent/history?session_id=' + encodeURIComponent(sid));
    box.innerHTML = '';
    const msgs = data.messages || [];
    if (!msgs.length) box.innerHTML = '<div class="empty">这个会话还没有消息</div>';
    for (const m of msgs) {
      if (m.role === 'user') addMessage('user', m.content);
      else if (m.role === 'assistant') addMessage('assistant', m.content);
    }
    // Load progress
    loadProgress(sid);
    // Refresh session list to highlight
    document.querySelectorAll('.session-item').forEach(el =>
      el.classList.toggle('active', el.dataset.sid === sid));
  } catch (e) {
    box.innerHTML = `<div class="empty" style="color:var(--error)">加载失败: ${esc(e.message)}</div>`;
  }
}

async function loadProgress(sid) {
  try {
    const p = await api('/api/v1/src-agent/progress' + (sid ? '?session_id=' + encodeURIComponent(sid) : ''));
    const t = p.totals || {};
    document.getElementById('hint').textContent =
      `进度 · 目标 ${t.targets||0} · 探索 ${t.total_explores||0} · 发现 ${t.findings||0} · 死路 ${t.dead_ends||0}`;
  } catch {}
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  setBusy(true);
  try {
    const body = { message: text };
    if (currentSession) body.session_id = currentSession;
    const data = await api('/api/v1/src-agent/chat', { method: 'POST', body: JSON.stringify(body) });
    currentSession = data.session_id;
    document.getElementById('sessionTitle').textContent = currentSession;
    document.getElementById('sessionBadge').style.display = 'inline-block';
    document.getElementById('sessionBadge').textContent = '在线';
    addMessage('assistant', data.reply || '(空回复)');
    // Show tool events
    for (const ev of (data.events || [])) {
      if (ev.kind === 'tool_call') addMessage('event', `🔧 ${ev.tool} ${ev.args_preview ? '· ' + ev.args_preview.slice(0,100) : ''}`);
    }
    loadProgress(currentSession);
    loadSessions();
  } catch (e) {
    addMessage('event', `错误: ${e.message}`);
  } finally {
    setBusy(false);
  }
}

document.getElementById('sendBtn').onclick = send;
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + 'px';
});
document.getElementById('newBtn').onclick = () => {
  currentSession = '';
  document.getElementById('sessionTitle').textContent = '新会话';
  document.getElementById('sessionBadge').style.display = 'none';
  document.getElementById('messages').innerHTML =
    '<div class="empty"><p>新会话</p><p style="font-size:12px">输入目标开始测试</p></div>';
  document.getElementById('input').focus();
  loadSessions();
};
document.getElementById('refreshBtn').onclick = () => { loadSessions(); if (currentSession) openSession(currentSession); };

loadSessions();
document.getElementById('input').focus();
</script>
</body>
</html>
